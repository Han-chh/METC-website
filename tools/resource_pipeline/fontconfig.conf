<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>

  <!-- Some supplied decks use decorative Latin fonts for Chinese text. Map them
       to installed CJK fonts before LibreOffice rasterizes the PDF. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Wedges</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HanziPen SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Jella</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HanziPen SC</string></edit>
  </match>
</fontconfig>
